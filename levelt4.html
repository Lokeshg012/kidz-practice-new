<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>4x1 Multiplication - Kidz Brain Academy</title>
    <link rel="icon" type="image/png" href="app.png">
    <link
        href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@600;700;800&display=swap"
        rel="stylesheet">
    <script>
        if (!sessionStorage.getItem("studentName") || !sessionStorage.getItem("studentBranch")) {
            window.location.href = "index.html";
        }
    </script>
    <style>
        :root {
            --bg: #FFF6E5;
            --surface: #ffffff;
            --text-dark: #2A2650;
            --text-soft: #635F7E;
            --pop-blue: #4DA8FF;
            --pop-blue-light: #EBF5FF;
            --pop-green: #2EC4A6;
            --pop-red: #FF6B9D;
            --pop-orange: #FF7A3D;
            --ink: #2A2650;
            --border: 3px solid var(--ink);
            --shadow: 0 4px 0 var(--ink);
            --radius-xl: 30px;
            --radius-lg: 22px;
            --radius-md: 16px;
            --radius-sm: 12px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background: var(--bg);
            color: var(--text-dark);
            line-height: 1.5;
            -webkit-font-smoothing: antialiased;
            background-image: radial-gradient(var(--text-soft) 1px, transparent 1px);
            background-size: 24px 24px;
            min-height: 100vh;
            padding-top: 80px;
        }

        /* ─── FLOAT HEADER ─── */
        header {
            position: fixed;
            top: 16px;
            left: 50%;
            transform: translateX(-50%);
            width: calc(100% - 32px);
            max-width: 900px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 12px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 100;
            box-shadow: 0 6px 0 var(--ink);
            border: var(--border);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .btn-icon {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            background: var(--bg);
            border-radius: var(--radius-sm);
            color: var(--text-soft);
            cursor: pointer;
            border: none;
            border: 2px solid var(--ink);
            box-shadow: 0 2px 0 var(--ink);
            transition: 0.2s;
        }

        .btn-icon:hover {
            color: var(--text-dark);
            background: #e2e8f0;
        }

        .header-title-box {
            display: flex;
            flex-direction: column;
        }

        .header-title {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
            line-height: 1.2;
        }

        .header-sub {
            font-size: 13px;
            font-weight: 700;
            color: var(--pop-blue);
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .timer-box {
            display: flex;
            align-items: center;
            gap: 8px;
            background: var(--surface);
            padding: 8px 16px;
            border-radius: var(--radius-sm);
            border: 2px solid var(--ink);
            box-shadow: 0 3px 0 var(--ink);
        }

        .timer-val {
            font-size: 18px;
            font-weight: 800;
            color: var(--pop-red);
            font-variant-numeric: tabular-nums;
        }

        .stat-box {
            font-size: 16px;
            font-weight: 800;
            color: var(--text-dark);
        }

        .stat-box span {
            color: var(--text-soft);
            font-size: 14px;
        }

        /* ─── CONTAINER ─── */
        .container {
            max-width: 860px;
            margin: 0 auto;
            padding: 24px 20px 60px;
        }

        /* ─── PROGRESS ─── */
        .progress-track {
            height: 12px;
            background: var(--surface);
            border-radius: 12px;
            margin-bottom: 32px;
            border: 2px solid var(--ink);
            box-shadow: 0 3px 0 var(--ink);
            overflow: hidden;
            position: relative;
        }

        .progress-fill {
            height: 100%;
            background: var(--pop-blue);
            width: 0%;
            transition: width 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            border-radius: 12px;
            border-right: 2px solid var(--ink);
        }

        /* ─── Q CARD (CLAYMORPHISM) ─── */
        .q-card {
            background: var(--surface);
            border-radius: var(--radius-lg);
            padding: 24px 28px;
            margin-bottom: 24px;
            border: var(--border);
            box-shadow: var(--shadow);
            transition: transform .15s ease;
        }

        .q-top {
            display: flex;
            align-items: center;
            gap: 16px;
            margin-bottom: 24px;
        }

        .q-num {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            background: var(--bg);
            color: var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: 800;
            border: 2px solid var(--ink);
            box-shadow: 0 3px 0 var(--ink);
            flex-shrink: 0;
            font-family: 'Fredoka', sans-serif;
        }

        .q-expr {
            font-family: 'Fredoka', monospace;
            font-size: 26px;
            font-weight: 800;
            color: var(--text-dark);
            letter-spacing: 2px;
        }

        /* ─── OPTIONS ─── */
        .opts {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 16px;
        }

        .opt {
            background: var(--surface);
            padding: 16px 12px;
            border-radius: var(--radius-md);
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-size: 20px;
            font-weight: 700;
            color: var(--text-dark);
            border: var(--border);
            box-shadow: var(--shadow);
            transition: transform .15s ease, box-shadow .15s ease;
        }

        .opt:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 0 var(--ink);
        }

        .opt:active {
            transform: translateY(2px);
            box-shadow: 0 2px 0 var(--ink);
        }

        .opt.selected {
            background: var(--pop-blue);
            color: white;
            border: var(--border);
            box-shadow: var(--shadow);
        }

        /* ─── PAGINATION ─── */
        .pagination {
            display: inline-flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            margin: 40px 0;
            padding: 12px;
            background: var(--surface);
            border-radius: 20px;
            border: var(--border);
            box-shadow: var(--shadow);
            left: 50%;
            position: relative;
            transform: translateX(-50%);
        }

        .pg-btn {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            border: 2px solid var(--ink);
            background: var(--surface);
            cursor: pointer;
            font-family: 'Fredoka', sans-serif;
            font-size: 15px;
            font-weight: 700;
            color: var(--text-soft);
            box-shadow: 0 3px 0 var(--ink);
            transition: transform .1s;
        }

        .pg-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 0 var(--ink);
        }

        .pg-btn.active {
            background: var(--pop-blue);
            color: white;
            transform: translateY(2px);
            box-shadow: 0 1px 0 var(--ink);
        }

        .pg-btn.touched:not(.active) {
            background: var(--pop-blue-light);
            color: var(--pop-blue);
        }

        /* ─── SUBMIT ─── */
        .submit-btn {
            display: block;
            width: 100%;
            max-width: 320px;
            margin: 0 auto;
            padding: 18px 24px;
            background: var(--pop-green);
            color: white;
            border: var(--border);
            border-radius: var(--radius-xl);
            font-size: 20px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            box-shadow: var(--shadow);
            transition: transform .15s ease;
        }

        .submit-btn:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 0 var(--ink);
        }

        /* ─── OVERLAYS ─── */
        .overlay {
            position: fixed;
            inset: 0;
            background: rgba(45, 55, 72, 0.4);
            backdrop-filter: blur(8px);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 500;
        }

        .overlay.open {
            display: flex;
        }

        .dialog {
            background: var(--surface);
            border-radius: var(--radius-xl);
            width: 100%;
            border: var(--border);
            box-shadow: 0 10px 0 var(--ink);
            transform: scale(0.9);
            opacity: 0;
            transition: all 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .overlay.open .dialog {
            transform: scale(1);
            opacity: 1;
        }

        .warn-dialog {
            max-width: 400px;
            padding: 32px;
            text-align: center;
        }

        .warn-dialog svg {
            width: 64px;
            height: 64px;
            color: var(--pop-orange);
            margin-bottom: 16px;
        }

        .warn-dialog h3 {
            font-size: 20px;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .warn-dialog p {
            color: var(--text-soft);
            font-weight: 600;
            margin-bottom: 24px;
        }

        .warn-actions {
            display: flex;
            gap: 12px;
        }

        .warn-actions button {
            flex: 1;
            padding: 14px;
            border-radius: var(--radius-md);
            font-size: 15px;
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            border: 2px solid var(--ink);
            box-shadow: 0 3px 0 var(--ink);
            transition: transform 0.15s;
        }

        .btn-cancel {
            background: var(--bg);
            color: var(--text-soft);
            box-shadow: inset 1px 1px 3px rgba(0, 0, 0, 0.05);
        }

        .btn-danger {
            background: var(--pop-red);
            color: white;
            box-shadow: 0 6px 16px rgba(239, 68, 68, 0.25);
        }

        /* ─── RESULT DIALOG ─── */
        .result-dialog {
            max-width: 480px;
            overflow: hidden;
            text-align: center;
            padding: 32px 24px;
        }

        .result-top h2 {
            font-size: 26px;
            font-weight: 900;
            color: var(--text-dark);
            margin-bottom: 4px;
        }

        .student-info {
            background: var(--bg);
            margin: 20px auto;
            max-width: 90%;
            padding: 12px 20px;
            border-radius: var(--radius-md);
            font-weight: 700;
            color: var(--text-soft);
            border: 2px solid var(--ink);
            box-shadow: 0 2px 0 var(--ink);
            display: flex;
            justify-content: space-between;
        }

        .student-info strong {
            color: var(--text-dark);
        }

        .score-display {
            padding: 16px 0 24px;
        }

        .score-big {
            font-size: 72px;
            font-weight: 900;
            line-height: 1;
            color: var(--pop-blue);
            text-shadow: 2px 2px 0px rgba(59, 130, 246, 0.1);
        }

        .score-total {
            font-size: 24px;
            font-weight: 800;
            color: var(--text-soft);
        }

        .score-pct {
            font-size: 18px;
            font-weight: 800;
            margin-top: 8px;
        }

        .result-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 32px;
        }

        .rs-item {
            background: var(--surface);
            padding: 16px;
            border-radius: var(--radius-md);
            border: 2px solid var(--ink);
            box-shadow: 0 4px 0 var(--ink);
        }

        .rs-val {
            font-size: 28px;
            font-weight: 900;
            line-height: 1.1;
        }

        .rs-lbl {
            font-size: 11px;
            font-weight: 800;
            color: var(--text-soft);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-top: 4px;
        }

        .result-footer button {
            width: 100%;
            max-width: 320px;
            padding: 16px;
            border-radius: var(--radius-lg);
            font-size: 18px;
            font-weight: 700;
            font-family: 'Fredoka', sans-serif;
            cursor: pointer;
            border: var(--border);
            background: var(--pop-blue);
            color: white;
            box-shadow: var(--shadow);
            transition: transform 0.2s;
        }

        .result-footer button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 var(--ink);
        }

        @media (max-width: 600px) {
            .opts {
                grid-template-columns: repeat(2, 1fr);
            }

            .header-title-box {
                display: none;
            }

            .q-card {
                padding: 20px;
            }

            .q-expr {
                font-size: 22px;
            }

            .student-info {
                flex-direction: column;
                gap: 8px;
                text-align: left;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-left">
            <button class="btn-icon" onclick="confirmBack()" aria-label="Go Back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M19 12H5" />
                    <path d="m12 19-7-7 7-7" />
                </svg>
            </button>
            <div class="header-title-box">
                <div class="header-title">Kidz Brain Academy</div>
                <div class="header-sub">4-Digit × 1-Digit</div>
            </div>
        </div>
        <div class="header-right">
            <div class="timer-box">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--pop-red)" stroke-width="3"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <polyline points="12 6 12 12 16 14"></polyline>
                </svg>
                <div class="timer-val" id="timer">0:30</div>
            </div>
            <div class="stat-box">
                <span id="attempted">0</span> <span>/ 50</span>
            </div>
        </div>
    </header>

    <div class="container">

        <div class="progress-track">
            <div class="progress-fill" id="progressBar"></div>
        </div>

        <div id="questions"></div>
        <div class="pagination" id="pagination"></div>

        <button class="submit-btn" onclick="handleSubmission()">Finish Assessment</button>
    </div>

    <!-- Back Warning -->
    <div class="overlay" id="backWarn">
        <div class="dialog warn-dialog">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z" />
                <line x1="12" y1="9" x2="12" y2="13" />
                <line x1="12" y1="17" x2="12.01" y2="17" />
            </svg>
            <h3>Leave this module?</h3>
            <p>Your current progress will not be saved if you leave now.</p>
            <div class="warn-actions">
                <button class="btn-cancel" onclick="closeBackWarn()">Cancel</button>
                <button class="btn-danger" onclick="goBack()">Leave</button>
            </div>
        </div>
    </div>

    <!-- Result Modal -->
    <div class="overlay" id="resultModal">
        <div class="dialog result-dialog">
            <div class="result-top">
                <h2>Assessment Block Complete</h2>
            </div>

            <div class="student-info" style="flex-wrap: wrap;">
                <div><strong id="resName"></strong></div>
                <div><strong id="resBranch"></strong></div>
                <div style="flex-basis: 100%; text-align: center; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--text-soft); padding-top: 10px; border-top: 2px dashed rgba(42,38,80,0.15);"
                    id="resTime"></div>
            </div>

            <div class="score-display">
                <span class="score-big" id="scoreNum">0</span><span class="score-total"> / 50</span>
                <div class="score-pct" id="scorePct">0% Mastery</div>
            </div>

            <div class="result-stats">
                <div class="rs-item">
                    <div class="rs-val" id="rsCorrect" style="color:var(--pop-green)">0</div>
                    <div class="rs-lbl">Correct</div>
                </div>
                <div class="rs-item">
                    <div class="rs-val" id="rsWrong" style="color:var(--pop-red)">0</div>
                    <div class="rs-lbl">Missed</div>
                </div>
                <div class="rs-item">
                    <div class="rs-val" id="rsSkipped" style="color:var(--pop-orange)">0</div>
                    <div class="rs-lbl">Skipped</div>
                </div>
            </div>

            <div class="result-footer">
                <button onclick="goBack()">Return to Dashboard</button>
            </div>
        </div>
    </div>

    <script>
        const TOTAL = 50;
        const PER_PAGE = 25;
        const PAGES = TOTAL / PER_PAGE;

        let questions = JSON.parse(sessionStorage.getItem('lt4_questions')) || [];
        let answers = JSON.parse(sessionStorage.getItem('lt4_answers')) || {};
        let timeLeft = parseInt(sessionStorage.getItem('lt4_time')) || 30; // 30s logic
        let currentPage = 1;
        let timerInterval;

        const rand = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;

        /* ── Grade Colors ── */
        const getGradeColor = pct => {
            if (pct >= 90) return 'var(--pop-green)';
            if (pct >= 70) return 'var(--pop-blue)';
            if (pct >= 50) return 'var(--pop-orange)';
            return 'var(--pop-red)';
        };


        function buildSmartOptions(a, b, correct) {
            const opts = new Set([correct]);
            opts.add(a * (b + 1));
            if (b > 2) opts.add(a * (b - 1));
            opts.add((a + 1) * b);
            if (a > 2) opts.add((a - 1) * b);

            opts.add(correct + 10);
            opts.add(correct - 10);
            opts.add(correct + 100);
            if (correct > 100) opts.add(correct - 100);

            let arr = Array.from(opts).filter(x => x > 0 && x !== correct);
            arr = arr.sort(() => Math.random() - 0.5);

            const finalOpts = [correct];
            for (let val of arr) {
                if (finalOpts.length >= 4) break;
                if (!finalOpts.includes(val)) finalOpts.push(val);
            }

            while (finalOpts.length < 4) {
                let r = correct + (Math.random() < 0.5 ? 1 : -1) * rand(1, b > 10 ? 50 : 15);
                if (r > 0 && !finalOpts.includes(r)) finalOpts.push(r);
            }
            return finalOpts.sort(() => Math.random() - 0.5);
        }

        function makeQuestion() {
            const a = rand(1000, 9999); const b = rand(2, 9); const correct = a * b;
            return { text: a + " × " + b, options: buildSmartOptions(a, b, correct), correct, type: 'mul' };
        }


        function generateQuestions() {
            if (questions.length >= TOTAL) return;
            const pool = [];
            for (let i = 0; i < TOTAL; i++) {
                pool.push(makeQuestion());
            }
            questions = pool;
            sessionStorage.setItem('lt4_questions', JSON.stringify(questions));
        }

        /* ── Render ── */
        function renderPage(page) {
            currentPage = page;
            const el = document.getElementById('questions');
            el.innerHTML = '';
            const start = (page - 1) * PER_PAGE;

            questions.slice(start, start + PER_PAGE).forEach((q, i) => {
                const idx = start + i;

                const card = document.createElement('div');
                card.className = 'q-card';
                card.innerHTML = `
                <div class="q-top">
                    <div class="q-num">${idx + 1}</div>
                    <div class="q-expr">${q.text} <span style="color:var(--text-soft)">=</span> ?</div>
                </div>
                <div class="opts">
                    ${q.options.map(o => `
                        <button class="opt${answers[idx] === o ? ' selected' : ''}"
                                onclick="pick(${idx},${o})">${o}</button>
                    `).join('')}
                </div>`;
                el.appendChild(card);
            });

            renderPagination();
            updateStats();
        }

        function renderPagination() {
            const nav = document.getElementById('pagination');
            nav.innerHTML = '';
            for (let i = 1; i <= PAGES; i++) {
                const s = (i - 1) * PER_PAGE;
                const done = questions.slice(s, s + PER_PAGE).some((_, j) => answers[s + j] != null);
                const btn = document.createElement('button');
                btn.className = `pg-btn${i === currentPage ? ' active' : ''}${done ? ' touched' : ''}`;
                btn.textContent = i;
                btn.onclick = () => { renderPage(i); scrollTo({ top: 0, behavior: 'smooth' }); };
                nav.appendChild(btn);
            }
        }

        function pick(idx, val) {
            answers[idx] = val;
            sessionStorage.setItem('lt4_answers', JSON.stringify(answers));
            renderPage(currentPage);
        }

        function updateStats() {
            const n = Object.keys(answers).length;
            document.getElementById('attempted').textContent = n;
            document.getElementById('progressBar').style.width = (n / TOTAL * 100) + '%';
        }

        /* ── Timer ── */
        function startTimer() {
            timerInterval = setInterval(() => {
                timeLeft--;
                sessionStorage.setItem('lt4_time', timeLeft);
                const m = Math.floor(Math.max(0, Math.floor(timeLeft)) / 60);
                const s = Math.max(0, Math.floor(timeLeft)) % 60;
                document.getElementById('timer').textContent = `${m}:${s < 10 ? '0' + s : s}`;
                if (timeLeft <= 0) handleSubmission();
            }, 1000);
        }

        /* ── Submit ── */
        function handleSubmission() {
            clearInterval(timerInterval);

            let correct = 0;
            questions.forEach((q, i) => { if (answers[i] === q.correct) correct++; });

            const attempted = Object.keys(answers).length;
            const wrong = attempted - correct;
            const skipped = TOTAL - attempted;
            const pct = Math.round((correct / TOTAL) * 100);

            document.getElementById('scoreNum').textContent = correct;
            document.getElementById('scorePct').textContent = pct + '% Mastery';
            document.getElementById('scorePct').style.color = getGradeColor(pct);

            document.getElementById('rsCorrect').textContent = correct;
            document.getElementById('rsWrong').textContent = wrong;
            document.getElementById('rsSkipped').textContent = skipped;

            const sName = sessionStorage.getItem("studentName") || "Student";
            const sBranch = sessionStorage.getItem("studentBranch") || "Branch";

            const now = new Date();
            const dateStr = now.toLocaleDateString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', year: 'numeric' });
            const timeStr = now.toLocaleTimeString('en-IN', { timeZone: 'Asia/Kolkata', hour: '2-digit', minute: '2-digit', hour12: true }).toUpperCase();

            document.getElementById('resName').textContent = sName;
            document.getElementById('resBranch').textContent = sBranch;
            document.getElementById('resTime').textContent = `🕒 Submitted: ${dateStr} at ${timeStr} IST`;

            // Wipe user details immediately so if they close the modal/refresh, they cannot retry
            sessionStorage.removeItem("studentName");
            sessionStorage.removeItem("studentBranch");
            sessionStorage.removeItem('lt4_questions');
            sessionStorage.removeItem('lt4_answers');
            sessionStorage.removeItem('lt4_time');

            document.getElementById('resultModal').classList.add('open');
        }

        /* ── Navigation ── */
        function confirmBack() { document.getElementById('backWarn').classList.add('open'); }
        function closeBackWarn() { document.getElementById('backWarn').classList.remove('open'); }
        function goBack() {
            sessionStorage.clear();
            window.location.href = 'index.html';
        }

        /* ── Init ── */
        generateQuestions();
        const im = Math.floor(Math.max(0, timeLeft) / 60), is = Math.max(0, timeLeft) % 60;
        document.getElementById('timer').textContent = `${im}:${is < 10 ? '0' + is : is}`;
        renderPage(1);
        startTimer();
    </script>
</body>

</html>
